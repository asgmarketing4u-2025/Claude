<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#173252" stroke-width="1"/>
    </pattern>
    <pattern id="gridBig" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#1E3E63" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="1600" height="700" fill="#0A1A2F"/>
  <rect width="1600" height="700" fill="url(#grid)"/>
  <rect width="1600" height="700" fill="url(#gridBig)"/>

  <!-- floor plan style house outline -->
  <g fill="none" stroke="#DCE7EA" stroke-width="2.5" opacity="0.85">
    <rect x="230" y="220" width="520" height="340"/>
    <line x1="230" y1="360" x2="750" y2="360"/>
    <line x1="490" y1="220" x2="490" y2="360"/>
    <line x1="490" y1="360" x2="490" y2="560"/>
    <line x1="610" y1="360" x2="610" y2="560"/>
    <rect x="340" y="255" width="70" height="10"/>
    <rect x="560" y="255" width="70" height="10"/>
  </g>
  <g fill="none" stroke="#FF6B2C" stroke-width="3">
    <line x1="230" y1="590" x2="750" y2="590"/>
    <line x1="230" y1="582" x2="230" y2="598"/>
    <line x1="750" y1="582" x2="750" y2="598"/>
  </g>
  <text x="440" y="615" font-family="monospace" font-size="16" fill="#FF6B2C" opacity="0.9">52'-0"</text>

  <!-- second structural sketch -->
  <g fill="none" stroke="#5FB6C9" stroke-width="1.5" opacity="0.55">
    <rect x="900" y="140" width="430" height="300" transform="rotate(2 900 140)"/>
    <circle cx="1115" cy="290" r="90"/>
    <line x1="900" y1="140" x2="1330" y2="440"/>
  </g>

  <g stroke="#DCE7EA" stroke-width="1" opacity="0.3">
    <line x1="0" y1="60" x2="1600" y2="60"/>
    <line x1="0" y1="640" x2="1600" y2="640"/>
  </g>
</svg>
